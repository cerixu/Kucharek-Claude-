name: Kucharek QA

concurrency:
  group: kucharek-qa-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Ensure generated real recipe corpus
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f recipe-library-data/BUILD-META.json ]; then
            node scripts/build-recipe-library.mjs
          else
            echo "Generated recipe corpus is present."
          fi

      - name: Syntax preflight
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Ensure WebKit dependencies
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install-deps chromium webkit
          echo "Playwright-managed browser dependencies installed."

      - name: Ensure Playwright browsers (cache-safe)
        shell: bash
        run: |
          set -euo pipefail
          need_install=0
          if ! node <<'NODE'
          const { chromium, webkit } = require('playwright');
          const fs = require('fs');
          let missing = false;
          for (const [name, browser] of [['chromium', chromium], ['webkit', webkit]]) {
            const path = browser.executablePath();
            if (!fs.existsSync(path)) {
              console.log(`Missing ${name}: ${path}`);
              missing = true;
            } else {
              console.log(`Found ${name}: ${path}`);
            }
          }
          process.exit(missing ? 2 : 0);
          NODE
          then
            need_install=1
          fi
          if [ "$need_install" -eq 1 ]; then
            npx playwright install chromium webkit
          else
            echo "Playwright browser binaries restored from cache."
          fi

      - name: Select QA scope
        id: qa_scope
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"
          case "$COMMIT_MESSAGE" in
            "Stage 37:"*) echo "test_files=tests/stage-37.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 38:"*) echo "test_files=tests/stage-38.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 39:"*) echo "test_files=tests/stage-39.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 40:"*) echo "test_files=tests/stage-40.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 41:"*) echo "test_files=tests/stage-41.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 42:"*) echo "test_files=tests/stage-42.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 43:"*) echo "test_files=__FULL__" >> "$GITHUB_OUTPUT" ;;
            "Stage 44:"*) echo "test_files=tests/stage-44.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 45:"*) echo "test_files=tests/stage-45.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 46:"*) echo "test_files=tests/stage-46.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 47:"*) echo "test_files=__FULL__" >> "$GITHUB_OUTPUT" ;;
            "Stage 48:"*) echo "test_files=__FULL__" >> "$GITHUB_OUTPUT" ;;
            "Stage 50:"*) echo "test_files=__FULL__" >> "$GITHUB_OUTPUT" ;;
            "Stage 51:"*) echo "test_files=tests/stage-51.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 52:"*) echo "test_files=tests/stage-52.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 53:"*) echo "test_files=tests/stage-53.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 54:"*) echo "test_files=tests/stage-54.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Optimize Stage 54 corpus gate"*) echo "test_files=tests/stage-54.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Wait for background archive before corpus assertions"*) echo "test_files=tests/startup.spec.js tests/stage-54.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Fix startup:"*) echo "test_files=tests/startup.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Bump app cache version"*) echo "test_files=tests/startup.spec.js tests/pwa.spec.js" >> "$GITHUB_OUTPUT" ;;
            *) echo "test_files=tests/startup.spec.js tests/user-mobile.spec.js" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run E2E
        env:
          CI: true
          TEST_FILES: ${{ steps.qa_scope.outputs.test_files }}
        shell: bash
        run: |
          if [ "$TEST_FILES" = "__FULL__" ]; then
            npm test -- --reporter=line
          else
            read -r -a TEST_ARGS <<< "$TEST_FILES"
            npm test -- --reporter=line "${TEST_ARGS[@]}"
          fi

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kucharek-playwright-results
          path: test-results/
          if-no-files-found: ignore
