name: Kucharek QA

concurrency:
  group: kucharek-qa-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Syntax preflight
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Ensure WebKit dependencies
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install-deps chromium webkit
          echo "Playwright-managed browser dependencies installed."

      - name: Ensure Playwright browsers (cache-safe)
        shell: bash
        run: |
          set -euo pipefail
          need_install=0
          if ! node <<'NODE'
          const { chromium, webkit } = require('playwright');
          const fs = require('fs');
          let missing = false;
          for (const [name, browser] of [['chromium', chromium], ['webkit', webkit]]) {
            const path = browser.executablePath();
            if (!fs.existsSync(path)) {
              console.log(`Missing ${name}: ${path}`);
              missing = true;
            } else {
              console.log(`Found ${name}: ${path}`);
            }
          }
          process.exit(missing ? 2 : 0);
          NODE
          then
            need_install=1
          fi
          if [ "$need_install" -eq 1 ]; then
            npx playwright install chromium webkit
          else
            echo "Playwright browser binaries restored from cache."
          fi

      - name: Select QA scope
        id: qa_scope
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          case "$COMMIT_MESSAGE" in
            "Stage 37:"*) echo "test_file=tests/stage-37.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 38:"*) echo "test_file=tests/stage-38.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 39:"*) echo "test_file=tests/stage-39.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 40:"*) echo "test_file=tests/stage-40.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 41:"*) echo "test_file=tests/stage-41.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 42:"*) echo "test_file=tests/stage-42.spec.js" >> "$GITHUB_OUTPUT" ;;
            "Stage 43:"*) echo "test_file=__FULL__" >> "$GITHUB_OUTPUT" ;;
            *) echo "test_file=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run E2E
        env:
          CI: true
          TEST_FILE: ${{ steps.qa_scope.outputs.test_file }}
        shell: bash
        run: |
          if [ "$TEST_FILE" = "__FULL__" ] || [ -z "$TEST_FILE" ]; then
            npm test -- --reporter=line
          else
            npm test -- --reporter=line "$TEST_FILE"
          fi

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kucharek-playwright-results
          path: test-results/
          if-no-files-found: ignore
