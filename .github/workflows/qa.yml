name: Kucharek QA

concurrency:
  group: kucharek-qa-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Syntax preflight
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Ensure WebKit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libevent-2.1-7t64 libopus0 || sudo apt-get install -y libevent-2.1-7 libopus0
          echo "WebKit runtime dependencies installed."

      - name: Ensure Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          need_install=0
          node <<'NODE'
          const { chromium, webkit } = require('playwright');
          const fs = require('fs');
          for (const [name, browser] of [['chromium', chromium], ['webkit', webkit]]) {
            const path = browser.executablePath();
            if (!fs.existsSync(path)) {
              console.log(`Missing ${name}: ${path}`);
              process.exitCode = 2;
            } else {
              console.log(`Found ${name}: ${path}`);
            }
          }
          NODE
          status=$?
          if [ "$status" -ne 0 ]; then
            need_install=1
          fi
          if [ "$need_install" -eq 1 ]; then
            npx playwright install chromium webkit
          else
            echo "Playwright browser binaries restored from cache."
          fi

      - name: Run E2E
        env:
          CI: true
        run: npm test -- --reporter=line

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kucharek-playwright-results
          path: test-results/
          if-no-files-found: ignore
