name: Build real recipe corpus

on:
  push:
    branches: [main]
    paths:
      - scripts/build-recipe-library.mjs
      - recipe-library.js
      - .github/workflows/recipe-corpus.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate corpus
        run: node scripts/build-recipe-library.mjs

      - name: Commit generated corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipe-library-data
          if git diff --cached --quiet; then
            echo "No corpus changes to commit."
            exit 0
          fi
          git commit -m "Stage 50: generate real recipe corpus"
          git push
