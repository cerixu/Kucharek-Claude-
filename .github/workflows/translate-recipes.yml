name: Stage 54 — static Polish recipe translation

concurrency:
  group: kucharek-static-translation
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'scripts/translate-recipe-library-v2.mjs'
      - 'recipe-library-data/**'
      - '.github/workflows/translate-recipes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Stage 54 generated:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Restore original recipe corpus
        run: |
          SOURCE_COMMIT="2403fac8b9076e920bfbad29896f80507710439b"
          git fetch origin "$SOURCE_COMMIT" --depth=1
          for f in recipe-library-data/part-*.js; do
            git show "$SOURCE_COMMIT:$f" > "$f"
          done

      - name: Translate 1700 records
        id: translate
        continue-on-error: true
        run: node scripts/translate-recipe-library-v2.mjs

      - name: Validate generated corpus
        run: |
          node --check scripts/translate-recipe-library-v2.mjs
          node -e "const fs=require('fs'); const files=fs.readdirSync('recipe-library-data').filter(x=>/^part-\\d\\d\\.js$/.test(x)); const n=files.reduce((a,f)=>a+(fs.readFileSync('recipe-library-data/'+f,'utf8').match(/rcp_archive_/g)||[]).length,0); if(n!==1700) throw new Error('Recipe count '+n); console.log('1700 records OK')"

      - name: Commit translation checkpoint
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/kucharek-translated
          cp recipe-library-data/part-*.js /tmp/kucharek-translated/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/kucharek-translated/part-*.js recipe-library-data/
          git add recipe-library-data/part-*.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          if [ "${{ steps.translate.outcome }}" = "success" ]; then
            git commit -m "Stage 54 generated: Polish recipe corpus"
          else
            git commit -m "Stage 54 checkpoint: Polish recipe corpus"
          fi
          git push

      - name: Fail when translation is incomplete
        if: steps.translate.outcome != 'success'
        run: exit 1
